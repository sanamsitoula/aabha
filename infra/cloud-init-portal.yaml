#cloud-config

# ============================================================
# AABHA - Azure VMSS application bootstrap
# ============================================================
# Application source code is NOT stored in this YAML.
# It is pulled from the GitHub repository during VMSS boot.
#
# GitHub:
# https://github.com/sanamsitoula/aabha.git
#
# Application:
#   /var/www/html/index.html
#   /var/www/html/config.php
#   /var/www/html/db.php
#   /var/www/html/api/booking.php
#   /var/www/html/api/health.php
# ============================================================

package_update: true

packages:
  - apache2
  - php
  - php-mysql
  - libapache2-mod-php
  - git
  - mysql-client

write_files:

  # ----------------------------------------------------------
  # Apache environment variables
  # ----------------------------------------------------------
  - path: /etc/apache2/conf-available/aabha-env.conf
    permissions: '0644'
    owner: root:root
    content: |
      SetEnv APP_ENV "production"
      SetEnv DB_HOST "aabha-mysql.mysql.database.azure.com"
      SetEnv DB_PORT "3306"
      SetEnv DB_NAME "restaurant_db"
      SetEnv DB_USER "aabha"
      SetEnv DB_PASS "Nepal@123"
      SetEnv ALLOWED_ORIGIN "*"

runcmd:

  # ----------------------------------------------------------
  # Make sure Apache is installed and enabled
  # ----------------------------------------------------------
  - systemctl enable apache2
  - systemctl start apache2

  # ----------------------------------------------------------
  # Clone the application from GitHub
  # ----------------------------------------------------------
  - rm -rf /opt/aabha
  - git clone --depth 1 https://github.com/sanamsitoula/aabha.git /opt/aabha

  # ----------------------------------------------------------
  # Clear default Apache website
  # ----------------------------------------------------------
  - rm -rf /var/www/html/*

  # ----------------------------------------------------------
  # Copy application from GitHub to Apache document root
  # ----------------------------------------------------------
  - cp /opt/aabha/index.html /var/www/html/
  - cp /opt/aabha/config.php /var/www/html/
  - cp /opt/aabha/db.php /var/www/html/

  # ----------------------------------------------------------
  # Copy API
  # ----------------------------------------------------------
  - mkdir -p /var/www/html/api
  - cp /opt/aabha/api/*.php /var/www/html/api/

  # ----------------------------------------------------------
  # Configure Apache
  # ----------------------------------------------------------
  - a2enmod php8.1
  - a2enconf aabha-env

  # ----------------------------------------------------------
  # Correct ownership
  # ----------------------------------------------------------
  - chown -R www-data:www-data /var/www/html
  - chmod 755 /var/www/html
  - find /var/www/html -type f -exec chmod 644 {} \;

  # ----------------------------------------------------------
  # Restart Apache after configuration
  # ----------------------------------------------------------
  - systemctl restart apache2

  # ----------------------------------------------------------
  # Create a deployment marker
  # ----------------------------------------------------------
  - bash -c 'echo "Aabha VMSS deployment completed: $(date)" > /var/log/aabha-deployment.log'

  # ----------------------------------------------------------
  # Local health test
  # ----------------------------------------------------------
  - bash -c 'curl -fsS http://127.0.0.1/api/health.php || true'

final_message: |
  Aabha VMSS bootstrap completed.
  Application was cloned from GitHub and deployed to /var/www/html.